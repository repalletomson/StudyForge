version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyforge-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=http://localhost:5173
      - WORKER_CRON=* * * * *
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - studyforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyforge-frontend
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - studyforge-network

volumes:
  backend_uploads:
    driver: local

networks:
  studyforge-network:
    driver: bridge